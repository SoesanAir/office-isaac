<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  `user-scalable=no` is a deliberate exception to the usual rule against disabling zoom.
  Pinch-zoom on a twin-stick game is not an accessibility affordance, it is a way to lose a
  run: two thumbs on the glass is the *normal* input here, and the browser reads that as a
  pinch. Text scaling is not lost — the game carries its own text-scale setting under
  Options (GDD 17.6), which scales the HUD and menus without resampling the playfield.
-->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05050a">
<meta name="color-scheme" content="dark">
<!-- Installable to the home screen, where it launches without browser chrome. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Office Isaac">
<link rel="manifest" href="manifest.webmanifest">
<title>Office Isaac</title>
<meta name="description" content="A top-down action roguelike set in a procedurally generated corporate tower.">
<!--
  GDD refs: 18.2 (pixel-perfect / nearest-neighbour integer scaling where achievable; 16:9
  primary composition with safe-area support), 17.6 (accessibility), 4.3 (the room is the
  frame), D-004/R-GOV-004 (no asset path assumes the codename is the product name).

  Plain ES modules, no build step: GitHub Pages serves this file directly.
-->
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="stage">
    <canvas id="game" width="960" height="540" aria-label="Game viewport" role="img"></canvas>
  </main>

  <!--
    There is deliberately no "rotate your device" gate.

    The game presents landscape unconditionally: in a portrait viewport the canvas is turned a
    quarter turn so it still fills the screen. A player holding the phone upright sees the game
    lying on its side, which tells them to turn it far more directly than a notice would — and
    costs them nothing if they choose not to, because it is already running.

    The geometry is in Renderer.resize(); the touch layer unrotates its coordinates from the
    `data-rotated` flag the renderer sets.
  -->

  <!--
    First-tap gate on mobile only.
    Browsers require a user gesture before audio may start AND before fullscreen may be
    requested, and both are wanted at the same moment, so one tap buys both. Hidden on
    pointer-precise devices, where neither is needed to start playing.
  -->
  <button id="enter" type="button" hidden>
    <span class="enter-title">Tap to play</span>
    <span class="enter-note">Sound on · fullscreen</span>
  </button>

  <noscript>
    <p class="notice">This build requires JavaScript and a browser with ES module support.</p>
  </noscript>

  <aside id="controls" aria-label="Controls">
    <dl>
      <dt>Move</dt><dd>W A S D</dd>
      <dt>Attack</dt><dd>Arrow keys</dd>
      <dt>Active item</dt><dd>Space</dd>
      <dt>Pocket item</dt><dd>Q</dd>
      <dt>Interact</dt><dd>E</dd>
      <dt>Map</dt><dd>Tab</dd>
      <dt>Pause</dt><dd>Esc</dd>
      <dt>Debug / collision / grayscale</dt><dd>F1 / F2 / F3</dd>
    </dl>
    <p class="touch-note">On a touch screen: left thumb moves, right thumb fires. Hold DROP to
      discard a weapon. All keys are remappable under Pause &rarr; Controls.</p>
  </aside>

  <script type="module" src="src/main.js"></script>
  <script type="module" src="src/shell.js"></script>
</body>
</html>
